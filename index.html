<!DOCTYPE html>
<html lang="zh-TW">
<head id="docHead">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>奇妙的部落：守護森林的小精靈 (mnanak na qalang)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link id="preloadNextImgLink" rel="preload" as="image" href="assets/graphics/1.jpg">
  <link id="preloadNextMusicLink" rel="preload" as="audio" href="assets/music/music1.mp3">
  <link id="preloadNextSpeechLink" rel="preload" as="audio" href="assets/speech/speech1.mp3">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

    :root {
      --primary-red: #9e2a2b;
      --tribal-gold: #e9c46a;
      --card-bg: rgba(20, 28, 22, 0.9);
    }

    * {
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #1b2e1e 0%, #080d09 100%);
      color: #fefae0;
      font-family: 'Zen Maru Gothic', 'Noto Serif TC', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      margin: 0;
    }

    .bg-particles {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #e9c46a, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 200px 200px;
      opacity: 0.3;
    }

    header {
      position: relative;
      z-index: 10;
      background: rgba(10, 15, 11, 0.95);
      border-bottom: 3px solid var(--tribal-gold);
      padding: 10px 20px;
    }

    .title-text {
      font-weight: 900;
      color: var(--tribal-gold);
      font-size: 1.4rem;
      letter-spacing: 1px;
    }

    .spirit-avatar {
      width: 40px;
      height: 40px;
      object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(233, 196, 106, 0.8));
      cursor: pointer;
    }

    .debug-panel {
      position: relative;
      z-index: 10;
      background: #0d1610;
      border-bottom: 1px dashed var(--tribal-gold);
      color: #a8dadc;
      font-family: monospace;
      font-size: 0.82rem;
      padding: 6px 20px;
    }

    .book-container {
      position: relative;
      z-index: 5;
      max-width: 950px;
      margin: auto;
      padding: 10px 15px;
      width: 100%;
    }

    .book-frame {
      background: var(--card-bg);
      border: 3px solid var(--tribal-gold);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    .img-wrapper {
      position: relative;
      width: 100%;
      height: 0;
      padding-bottom: 56.25%;
      background-color: #000;
      overflow: hidden;
    }

    .story-img {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: contain;
      transition: opacity 0.25s ease;
    }

    .page-badge {
      position: absolute;
      top: 15px; right: 15px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid var(--tribal-gold);
      color: var(--tribal-gold);
      padding: 3px 12px;
      border-radius: 15px;
      font-size: 0.9rem;
      font-weight: bold;
      z-index: 6;
    }

    .status-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 15, 11, 0.92);
      border: 2px solid var(--tribal-gold);
      color: #fefae0;
      padding: 12px 22px;
      border-radius: 12px;
      z-index: 8;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.85);
    }

    .status-overlay.error-box {
      border-color: #e63946;
      background: rgba(40, 10, 12, 0.95);
    }

    .nav-arrow-btn {
      position: absolute;
      top: 0; bottom: 0;
      width: 15%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.1);
      color: #fff;
      font-size: 2.5rem;
      border: none;
      z-index: 5;
      transition: all 0.3s ease;
      opacity: 0.4;
      cursor: pointer;
    }

    .nav-arrow-btn:hover:not(:disabled) {
      background: rgba(0, 0, 0, 0.5);
      color: var(--tribal-gold);
      opacity: 1;
    }

    .nav-arrow-btn:disabled {
      opacity: 0.12;
      cursor: not-allowed;
      pointer-events: none;
    }

    .nav-arrow-left { left: 0; }
    .nav-arrow-right { right: 0; }

    .story-text-box {
      padding: 15px 20px;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      background: rgba(10, 15, 11, 0.9);
      border-top: 1px solid rgba(233, 196, 106, 0.2);
    }

    .story-text {
      font-size: 1.2rem;
      line-height: 1.6;
      color: #fefae0;
      margin: 0;
      flex-grow: 1;
    }

    .read-action-btn {
      background: linear-gradient(135deg, #e9c46a, #f4a261);
      color: #111d13;
      border: none;
      border-radius: 25px;
      padding: 8px 18px;
      font-weight: bold;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(233, 196, 106, 0.4);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .read-action-btn:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #f4a261, #e9c46a);
    }

    .read-action-btn.is-playing {
      outline: 2px solid #fff;
      box-shadow: 0 0 16px rgba(233, 196, 106, 0.9);
    }

    .controls-bar {
      position: relative;
      z-index: 10;
      background: rgba(10, 15, 11, 0.95);
      border-top: 2px solid rgba(233, 196, 106, 0.3);
      padding: 10px 20px;
    }

    .btn-nav-bottom {
      background: rgba(233, 196, 106, 0.15);
      border: 1px solid var(--tribal-gold);
      color: var(--tribal-gold);
      border-radius: 8px;
      padding: 6px 16px;
      font-weight: bold;
      transition: all 0.2s;
    }

    .btn-nav-bottom:hover:not(:disabled) {
      background: var(--tribal-gold);
      color: #111d13;
    }

    .btn-nav-bottom:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      border-color: rgba(233, 196, 106, 0.4);
      color: rgba(233, 196, 106, 0.4);
    }

    @media (max-width: 768px) {
      .title-text { font-size: 1.05rem; }
      .story-text { font-size: 0.95rem; }
      .nav-arrow-btn { width: 18%; font-size: 1.8rem; opacity: 0.7; }
      .controls-bar { flex-wrap: wrap; gap: 8px; justify-content: center !important; }
    }
  </style>
</head>
<body>

  <div class="bg-particles"></div>

  <header class="d-flex justify-content-between align-items-center flex-wrap gap-2">
    <div class="d-flex align-items-center gap-2">
      <img src="assets/graphics/spirit.png" alt="靈魂精靈" class="spirit-avatar" onclick="toggleThemeSong()">
      <div>
        <div class="title-text">奇妙的部落 mnanak na qalang</div>
      </div>
    </div>

    <div class="d-flex align-items-center gap-2 flex-wrap">
      <div class="form-check form-switch text-light me-1">
        <input class="form-check-input" type="checkbox" id="autoReadSwitch" checked onchange="toggleAutoRead(this.checked)">
        <label class="form-check-switch-label small text-warning" for="autoReadSwitch">自動朗讀</label>
      </div>

      <button type="button" class="btn btn-outline-warning btn-sm text-light" onclick="toggleBgMusicBtn()" id="bgMusicBtn" aria-label="背景音樂開關">
        <i class="fa-solid fa-music"></i> 背景音樂
      </button>

      <button type="button" class="btn btn-outline-warning btn-sm text-light" onclick="toggleThemeSong()" id="themeSongBtn" aria-label="主題曲">
        <i class="fa-solid fa-guitar"></i> 主題曲
      </button>

      <button type="button" class="btn btn-outline-info btn-sm" onclick="toggleDebugPanel()" id="debugToggleBtn" aria-label="除錯面板" aria-expanded="false">
        <i class="fa-solid fa-bug"></i> 除錯
      </button>
    </div>
  </header>

  <div id="debugPanel" class="debug-panel d-none" role="region" aria-label="除錯資訊">
    <span id="debugOutput">除錯就緒：第 0 頁</span>
  </div>

  <main class="book-container">
    <div class="book-frame">
      <div class="img-wrapper">
        <span class="page-badge" id="pageBadge">0 / 19</span>
        <img id="storyImage" class="story-img" src="assets/graphics/0.jpg" alt="故事繪本畫面">

        <div id="loadingNotice" class="status-overlay d-none" role="status" aria-live="polite">
          <i class="fa-solid fa-spinner fa-spin me-2 text-warning"></i>
          <span id="loadingText">載入素材中，請稍候...</span>
        </div>

        <div id="errorNotice" class="status-overlay error-box d-none" role="alert" aria-live="assertive">
          <div class="mb-2 fw-bold text-warning">
            <i class="fa-solid fa-triangle-exclamation me-1"></i>
            <span id="errorText">素材載入失敗，請重試</span>
          </div>
          <button type="button" id="retryBtn" class="btn btn-warning btn-sm fw-bold" onclick="retryLoadAssets()">
            <i class="fa-solid fa-rotate-right me-1"></i> 重新載入
          </button>
        </div>

        <button type="button" id="prevArrowBtn" class="nav-arrow-btn nav-arrow-left" onclick="prevPage()" title="上一頁" aria-label="上一頁" disabled aria-disabled="true">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button type="button" id="nextArrowBtn" class="nav-arrow-btn nav-arrow-right" onclick="nextPage()" title="下一頁" aria-label="下一頁">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

      <div class="story-text-box">
        <p class="story-text" id="storyText">在很久很久以前，山林深處有一個充滿奇幻色彩的泰雅部落……</p>

        <button type="button" class="read-action-btn" onclick="toggleSpeech(event)" id="readBtn" aria-label="朗讀與暫停">
          <i class="fa-solid fa-volume-high"></i> <span id="readBtnText">朗讀</span>
        </button>
      </div>
    </div>
  </main>

  <footer class="controls-bar d-flex justify-content-between align-items-center">
    <div class="small text-warning">
      <i class="fa-solid fa-headphones me-1"></i> <span id="musicTrackName">背景音樂：music0.mp3</span>
    </div>

    <div class="d-flex align-items-center gap-2">
      <button type="button" id="prevBottomBtn" class="btn btn-nav-bottom btn-sm" onclick="prevPage()" aria-label="上一頁" disabled aria-disabled="true"><i class="fa-solid fa-arrow-left me-1"></i> 上一頁</button>
      <button type="button" id="nextBottomBtn" class="btn btn-nav-bottom btn-sm" onclick="nextPage()" aria-label="下一頁">下一頁 <i class="fa-solid fa-arrow-right ms-1"></i></button>
    </div>

    <div class="d-flex align-items-center gap-2">
      <button type="button" id="muteBtn" class="btn btn-outline-warning btn-sm" onclick="toggleMute()" aria-label="靜音" aria-pressed="false" title="靜音">
        <i class="fa-solid fa-volume-high" id="muteIcon"></i> <span id="muteBtnText">靜音</span>
      </button>
      <input type="range" class="form-range" id="volumeSlider" aria-label="音量調整" min="0" max="1" step="0.05" value="0.8" style="width: 70px;" oninput="adjustVolume(this.value)" onchange="adjustVolume(this.value)">
    </div>
  </footer>

  <audio id="bgMusicPlayer" title="背景音樂" aria-label="背景音樂" data-role="background-music" src="assets/music/music0.mp3" preload="auto" loop></audio>
  <audio id="speechPlayer" title="故事朗讀" aria-label="故事朗讀" data-role="narration" src="assets/speech/speech0.mp3" preload="auto"></audio>
  <audio id="themeSongPlayer" title="主題曲伴奏" aria-label="主題曲伴奏" src="assets/music/伴奏.mp3" preload="metadata" loop></audio>

  <script>
    const storyData = [
      { id: 0, img: 'assets/graphics/0.jpg', music: 'assets/music/music0.mp3', speech: 'assets/speech/speech0.mp3', text: '在很久很久以前，山林深處有一個充滿奇幻色彩的泰雅部落……' },
      { id: 1, img: 'assets/graphics/1.jpg', music: 'assets/music/music1.mp3', speech: 'assets/speech/speech1.mp3', text: '清晨的第一道曙光照亮山谷，勇士踏上熟悉的獵徑，開啟新的一天。' },
      { id: 2, img: 'assets/graphics/2.jpg', music: 'assets/music/music2.mp3', speech: 'assets/speech/speech2.mp3', text: '當夜晚降臨，大樹下傳來悠揚的笛聲，那是老長老在為孩子們講述部落的傳說。' },
      { id: 3, img: 'assets/graphics/3.jpg', music: 'assets/music/music3.mp3', speech: 'assets/speech/speech3.mp3', text: '傳說在森林的深處，祖靈的雕像默默守護著這片大地與萬物。' },
      { id: 4, img: 'assets/graphics/4.jpg', music: 'assets/music/music4.mp3', speech: 'assets/speech/speech4.mp3', text: '突然間，樹洞泛起奇異的光芒！一群活潑的祖靈小精靈從洞裡跳了出來！' },
      { id: 5, img: 'assets/graphics/5.jpg', music: 'assets/music/music5.mp3', speech: 'assets/speech/speech5.mp3', text: '小精靈們引領著孩子們踏入竹林，腳步聲「咚咚咚」地敲響了森林的脈搏。' },
      { id: 6, img: 'assets/graphics/6.jpg', music: 'assets/music/music6.mp3', speech: 'assets/speech/speech6.mp3', text: '在蟲鳴圍繞的夜晚，小精靈帶來了山林智慧，告訴孩子們如何尊重自然。' },
      { id: 7, img: 'assets/graphics/7.jpg', music: 'assets/music/music7.mp3', speech: 'assets/speech/speech7.mp3', text: '「囉～囉～囉！」大家開心地歡唱，慶祝著人與森林和諧相處的喜悅。' },
      { id: 8, img: 'assets/graphics/8.jpg', music: 'assets/music/music8.mp3', speech: 'assets/speech/speech8.mp3', text: '拍拍手、拍拍手！豐收的喜悅伴隨美味食物，分享給部落的每一個人。' },
      { id: 9, img: 'assets/graphics/9.jpg', music: 'assets/music/music9.mp3', speech: 'assets/speech/speech9.mp3', text: '老長老的琴聲輕揚，將祖先的智慧與對大自然的愛，一代一代傳承下去。' },
      { id: 10, img: 'assets/graphics/10.jpg', music: 'assets/music/music10.mp3', speech: 'assets/speech/speech10.mp3', text: '微風吹過，森林裡的鳥兒一同齊唱，回應著孩子們純真無邪的笑聲。' },
      { id: 11, img: 'assets/graphics/11.jpg', music: 'assets/music/music11.mp3', speech: 'assets/speech/speech11.mp3', text: '一步一步，腳步堅定。經過歷練的孩子塗上彩繪，成為保護部落的勇士。' },
      { id: 12, img: 'assets/graphics/12.jpg', music: 'assets/music/music12.mp3', speech: 'assets/speech/speech12.mp3', text: '經過了一整天的勞動，勇士仰望繁星點點的夜空，心裡充滿感恩。' },
      { id: 13, img: 'assets/graphics/13.jpg', music: 'assets/music/music13.mp3', speech: 'assets/speech/speech13.mp3', text: '清澈的溪水旁響起悠揚笛聲，大家高舉竹杯，共飲象徵團結的甘甜泉水。' },
      { id: 14, img: 'assets/graphics/14.jpg', music: 'assets/music/music14.mp3', speech: 'assets/speech/speech14.mp3', text: '鋼琴聲如跳躍的足跡，孩子們在森林寶庫裡發現了許多珍貴的植物與果實。' },
      { id: 15, img: 'assets/graphics/15.jpg', music: 'assets/music/music15.mp3', speech: 'assets/speech/speech15.mp3', text: '敲響響板，山羊在樹影間悠閒漫步，展現出人與動物的和諧共生。' },
      { id: 16, img: 'assets/graphics/16.jpg', music: 'assets/music/music16.mp3', speech: 'assets/speech/speech16.mp3', text: '「啵！啵！」靈感點亮了思緒，老長老幽默的指點讓孩子恍然大悟。' },
      { id: 17, img: 'assets/graphics/17.jpg', music: 'assets/music/music17.mp3', speech: 'assets/speech/speech17.mp3', text: '營火轟隆隆地燃燒，鼓聲震天，這是專屬於部落最熱烈的感恩慶典！' },
      { id: 18, img: 'assets/graphics/18.jpg', music: 'assets/music/music18.mp3', speech: 'assets/speech/speech18.mp3', text: '老長老撫摸著孩子的頭，祝福他帶著智慧與勇氣繼續成長。' },
      { id: 19, img: 'assets/graphics/19.jpg', music: 'assets/music/music19.mp3', speech: 'assets/speech/speech19.mp3', text: '祖靈精靈展開翅膀飛向天際，這座奇妙的部落將永遠獲得祝福與安康。' }
    ];

    let currentPage = 0;
    let globalVolume = 0.8;
    let isMuted = false;
    let isAutoRead = true;
    let isThemePlaying = false;
    let bgMusicEnabled = true;
    let pageTransitionId = 0;
    let loadingTimer = null;
    let isTtsSpeaking = false;

    const bgMusicPlayer = document.getElementById('bgMusicPlayer');
    const speechPlayer = document.getElementById('speechPlayer');
    const themeSongPlayer = document.getElementById('themeSongPlayer');
    const storyImage = document.getElementById('storyImage');

    const preloadImgObj = new Image();
    const preloadMusicObj = new Audio();
    preloadMusicObj.preload = 'auto';
    const preloadSpeechObj = new Audio();
    preloadSpeechObj.preload = 'auto';

    storyImage.addEventListener('load', () => {
      hideLoadingNotice();
      hideErrorNotice();
      updateDebugInfo();
    });

    storyImage.addEventListener('error', () => {
      hideLoadingNotice();
      showErrorNotice('故事插圖載入失敗，請點擊重新載入');
      updateDebugInfo();
    });

    bgMusicPlayer.addEventListener('canplay', () => {
      hideLoadingNotice();
      updateDebugInfo();
    });

    bgMusicPlayer.addEventListener('error', () => {
      hideLoadingNotice();
      showErrorNotice('背景音樂載入失敗，請點擊重新載入');
      updateDebugInfo();
    });

    speechPlayer.addEventListener('canplay', () => {
      hideLoadingNotice();
      updateDebugInfo();
    });

    speechPlayer.addEventListener('error', () => {
      hideLoadingNotice();
      updateDebugInfo();
    });

    speechPlayer.addEventListener('play', () => {
      bgMusicPlayer.volume = globalVolume * 0.25;
      updateReadButtonUI(true);
      updateDebugInfo();
    });

    speechPlayer.addEventListener('pause', () => {
      if (!isTtsSpeaking) {
        bgMusicPlayer.volume = globalVolume;
        updateReadButtonUI(false);
      }
      updateDebugInfo();
    });

    speechPlayer.addEventListener('ended', () => {
      bgMusicPlayer.volume = globalVolume;
      updateReadButtonUI(false);
      updateDebugInfo();
    });

    window.addEventListener('DOMContentLoaded', () => {
      applyMuteState();
      bgMusicPlayer.volume = globalVolume;
      speechPlayer.volume = globalVolume;

      updatePageContent(false);
      preloadNextAssets(0);
      playBgMusic();

      const unlockAudio = () => {
        if (bgMusicEnabled && bgMusicPlayer.paused && !isThemePlaying) {
          playBgMusic();
        }
      };
      document.addEventListener('pointerdown', unlockAudio, { once: true });
      document.addEventListener('keydown', unlockAudio, { once: true });
    });

    function showLoadingNotice(msg = '載入中，請稍候...') {
      clearTimeout(loadingTimer);
      document.getElementById('loadingText').innerText = msg;
      loadingTimer = setTimeout(() => {
        document.getElementById('loadingNotice').classList.remove('d-none');
      }, 200);
    }

    function hideLoadingNotice() {
      clearTimeout(loadingTimer);
      document.getElementById('loadingNotice').classList.add('d-none');
    }

    function showErrorNotice(msg) {
      document.getElementById('errorText').innerText = msg;
      document.getElementById('errorNotice').classList.remove('d-none');
    }

    function hideErrorNotice() {
      document.getElementById('errorNotice').classList.add('d-none');
    }

    function retryLoadAssets() {
      hideErrorNotice();
      showLoadingNotice('重新載入素材中...');
      const page = storyData[currentPage] || storyData[0];
      const bust = `?retry=${Date.now()}`;

      storyImage.src = page.img + bust;
      bgMusicPlayer.src = page.music + bust;
      bgMusicPlayer.load();
      if (bgMusicEnabled && !isThemePlaying) {
        playBgMusic();
      }

      speechPlayer.src = page.speech + bust;
      speechPlayer.load();
      if (isAutoRead) {
        startSpeech(pageTransitionId);
      }
      updateDebugInfo();
    }

    function applyMuteState() {
      bgMusicPlayer.muted = isMuted;
      speechPlayer.muted = isMuted;
      themeSongPlayer.muted = isMuted;

      if (isMuted && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        isTtsSpeaking = false;
      }

      const muteBtn = document.getElementById('muteBtn');
      const muteIcon = document.getElementById('muteIcon');
      const muteBtnText = document.getElementById('muteBtnText');

      muteBtn.setAttribute('aria-pressed', String(isMuted));
      if (isMuted) {
        muteBtn.className = 'btn btn-danger btn-sm';
        muteIcon.className = 'fa-solid fa-volume-xmark';
        muteBtnText.innerText = '解除靜音';
      } else {
        muteBtn.className = 'btn btn-outline-warning btn-sm';
        muteIcon.className = 'fa-solid fa-volume-high';
        muteBtnText.innerText = '靜音';
      }
      updateDebugInfo();
    }

    function toggleMute() {
      isMuted = !isMuted;
      applyMuteState();
    }

    function updateReadButtonUI(isPlaying) {
      const readBtn = document.getElementById('readBtn');
      const readBtnText = document.getElementById('readBtnText');
      if (isPlaying) {
        readBtn.classList.add('is-playing');
        readBtnText.innerText = '暫停';
      } else {
        readBtn.classList.remove('is-playing');
        readBtnText.innerText = '朗讀';
      }
    }

    function updateNavButtonsState() {
      const isFirstPage = currentPage <= 0;
      const isLastPage = currentPage >= storyData.length - 1;

      const prevButtons = [
        document.getElementById('prevArrowBtn'),
        document.getElementById('prevBottomBtn')
      ];
      const nextButtons = [
        document.getElementById('nextArrowBtn'),
        document.getElementById('nextBottomBtn')
      ];

      prevButtons.forEach(btn => {
        if (btn) {
          btn.disabled = isFirstPage;
          btn.setAttribute('aria-disabled', String(isFirstPage));
        }
      });

      nextButtons.forEach(btn => {
        if (btn) {
          btn.disabled = isLastPage;
          btn.setAttribute('aria-disabled', String(isLastPage));
        }
      });
    }

    function preloadNextAssets(index) {
      const nextIdx = index + 1;
      const imgLink = document.getElementById('preloadNextImgLink');
      const musicLink = document.getElementById('preloadNextMusicLink');
      const speechLink = document.getElementById('preloadNextSpeechLink');

      if (nextIdx < storyData.length) {
        const nextPageData = storyData[nextIdx];
        if (imgLink) imgLink.href = nextPageData.img;
        if (musicLink) musicLink.href = nextPageData.music;
        if (speechLink) speechLink.href = nextPageData.speech;

        preloadImgObj.src = nextPageData.img;
        preloadMusicObj.src = nextPageData.music;
        preloadMusicObj.load();
        preloadSpeechObj.src = nextPageData.speech;
        preloadSpeechObj.load();
      }
    }

    function stopAllSpeech() {
      speechPlayer.pause();
      speechPlayer.currentTime = 0;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      isTtsSpeaking = false;
      bgMusicPlayer.volume = globalVolume;
      updateReadButtonUI(false);
    }

    function updatePageContent(shouldPlaySpeech = false) {
      pageTransitionId++;
      const currentTransition = pageTransitionId;
      const page = storyData[currentPage] || storyData[0];

      hideErrorNotice();
      updateNavButtonsState();

      if (!storyImage.src.endsWith(page.img)) {
        showLoadingNotice('載入故事畫面與音檔中...');
        storyImage.style.opacity = '0.35';
        storyImage.src = page.img;
        storyImage.onload = () => {
          storyImage.style.opacity = '1';
          hideLoadingNotice();
        };
      }

      document.getElementById('storyText').innerText = page.text || '';
      document.getElementById('pageBadge').innerText = `${currentPage} / ${storyData.length - 1}`;
      document.getElementById('musicTrackName').innerText = `背景音樂：music${currentPage}.mp3`;

      stopAllSpeech();
      applyMuteState();

      if (bgMusicEnabled && !isThemePlaying) {
        if (!bgMusicPlayer.src.endsWith(page.music)) {
          bgMusicPlayer.src = page.music;
        }
        playBgMusic();
      }

      if (!speechPlayer.src.endsWith(page.speech)) {
        speechPlayer.src = page.speech;
      }

      if (isAutoRead && shouldPlaySpeech) {
        startSpeech(currentTransition);
      }

      preloadNextAssets(currentPage);
      updateDebugInfo();
    }

    function playBgMusic() {
      if (!bgMusicEnabled || isThemePlaying) return;
      bgMusicPlayer.muted = isMuted;
      bgMusicPlayer.volume = (speechPlayer.paused && !isTtsSpeaking) ? globalVolume : globalVolume * 0.25;
      const playPromise = bgMusicPlayer.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          document.getElementById('bgMusicBtn').className = 'btn btn-warning btn-sm text-dark';
          updateDebugInfo();
        }).catch(() => {});
      }
    }

    function toggleBgMusicBtn() {
      if (isThemePlaying) {
        themeSongPlayer.pause();
        isThemePlaying = false;
        document.getElementById('themeSongBtn').className = 'btn btn-outline-warning btn-sm text-light';
      }
      if (bgMusicPlayer.paused) {
        bgMusicEnabled = true;
        playBgMusic();
      } else {
        bgMusicEnabled = false;
        bgMusicPlayer.pause();
        document.getElementById('bgMusicBtn').className = 'btn btn-outline-warning btn-sm text-light';
      }
      updateDebugInfo();
    }

    function speakWithWebSpeechFallback(text, expectedTransitionId) {
      if (isMuted || !('speechSynthesis' in window) || !text) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-TW';
      utterance.rate = 0.95;
      utterance.volume = globalVolume;

      utterance.onstart = () => {
        if (expectedTransitionId !== pageTransitionId) {
          window.speechSynthesis.cancel();
          return;
        }
        isTtsSpeaking = true;
        bgMusicPlayer.volume = globalVolume * 0.25;
        updateReadButtonUI(true);
      };

      utterance.onend = () => {
        isTtsSpeaking = false;
        bgMusicPlayer.volume = globalVolume;
        updateReadButtonUI(false);
      };

      utterance.onerror = () => {
        isTtsSpeaking = false;
        bgMusicPlayer.volume = globalVolume;
        updateReadButtonUI(false);
      };

      window.speechSynthesis.speak(utterance);
    }

    function startSpeech(expectedTransitionId = pageTransitionId) {
      const page = storyData[currentPage] || storyData[0];

      if (bgMusicEnabled && !isThemePlaying && bgMusicPlayer.paused) {
        bgMusicPlayer.muted = isMuted;
        bgMusicPlayer.volume = globalVolume;
        bgMusicPlayer.play().catch(() => {});
      }

      if (!speechPlayer.src.endsWith(page.speech)) {
        speechPlayer.src = page.speech;
      }
      if (speechPlayer.ended) {
        speechPlayer.currentTime = 0;
      }
      speechPlayer.muted = isMuted;
      speechPlayer.volume = globalVolume;

      const playPromise = speechPlayer.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          if (expectedTransitionId !== pageTransitionId) {
            speechPlayer.pause();
            speechPlayer.currentTime = 0;
          }
        }).catch(() => {
          if (expectedTransitionId === pageTransitionId) {
            speakWithWebSpeechFallback(page.text, expectedTransitionId);
          }
        });
      }
    }

    function toggleSpeech(event) {
      if (event) {
        event.stopPropagation();
      }
      if (speechPlayer.paused && !isTtsSpeaking) {
        startSpeech(pageTransitionId);
      } else {
        stopAllSpeech();
      }
    }

    function toggleAutoRead(checked) {
      isAutoRead = checked;
      updateDebugInfo();
    }

    function prevPage() {
      if (currentPage > 0) {
        currentPage--;
        updatePageContent(true);
      }
    }

    function nextPage() {
      if (currentPage < storyData.length - 1) {
        currentPage++;
        updatePageContent(true);
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.key === ' ') {
        e.preventDefault();
        toggleSpeech();
        return;
      }
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevPage();
      }
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextPage();
      }
      if (e.key === 'd' || e.key === 'D') {
        toggleDebugPanel();
      }
    });

    function toggleThemeSong() {
      const btn = document.getElementById('themeSongBtn');
      if (isThemePlaying) {
        themeSongPlayer.pause();
        isThemePlaying = false;
        btn.className = 'btn btn-outline-warning btn-sm text-light';
        if (bgMusicEnabled) playBgMusic();
      } else {
        bgMusicPlayer.pause();
        themeSongPlayer.muted = isMuted;
        themeSongPlayer.volume = globalVolume;
        themeSongPlayer.play().catch(() => {});
        isThemePlaying = true;
        btn.className = 'btn btn-warning btn-sm text-dark';
      }
      updateDebugInfo();
    }

    function adjustVolume(val) {
      globalVolume = parseFloat(val);
      bgMusicPlayer.volume = (speechPlayer.paused && !isTtsSpeaking) ? globalVolume : globalVolume * 0.25;
      speechPlayer.volume = globalVolume;
      themeSongPlayer.volume = globalVolume;
      updateDebugInfo();
    }

    function toggleDebugPanel() {
      const panel = document.getElementById('debugPanel');
      const btn = document.getElementById('debugToggleBtn');
      const isHidden = panel.classList.toggle('d-none');
      btn.setAttribute('aria-expanded', String(!isHidden));
      updateDebugInfo();
    }

    function updateDebugInfo() {
      const out = document.getElementById('debugOutput');
      if (!out) return;
      const nextIdx = currentPage < storyData.length - 1 ? currentPage + 1 : '無(末頁)';
      out.innerText = `[DEBUG] 頁碼: ${currentPage}/${storyData.length - 1} | 靜音: ${isMuted} | 背景音樂: ${bgMusicPlayer.paused ? '暫停' : '播放'}(vol=${bgMusicPlayer.volume.toFixed(2)}) | 朗讀: ${(speechPlayer.paused && !isTtsSpeaking) ? '暫停' : '播放'} | 預載下頁: ${nextIdx}`;
    }
  </script>
</body>
</html>
