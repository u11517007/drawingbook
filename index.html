<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>奇妙的部落：守護森林的小精靈 (mnanak na qalang)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

    :root {
      --primary-red: #9e2a2b;
      --tribal-gold: #e9c46a;
      --card-bg: rgba(20, 28, 22, 0.9);
    }

    * {
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #1b2e1e 0%, #080d09 100%);
      color: #fefae0;
      font-family: 'Zen Maru Gothic', 'Noto Serif TC', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      margin: 0;
    }

    /* 背景粒子 */
    .bg-particles {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #e9c46a, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 200px 200px;
      opacity: 0.3;
    }

    /* 頂部導覽 */
    header {
      position: relative;
      z-index: 10;
      background: rgba(10, 15, 11, 0.95);
      border-bottom: 3px solid var(--tribal-gold);
      padding: 10px 20px;
    }

    .title-text {
      font-weight: 900;
      color: var(--tribal-gold);
      font-size: 1.4rem;
      letter-spacing: 1px;
    }

    .spirit-avatar {
      width: 40px;
      height: 40px;
      object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(233, 196, 106, 0.8));
      cursor: pointer;
    }

    /* 繪本主要框架 */
    .book-container {
      position: relative;
      z-index: 5;
      max-width: 950px;
      margin: auto;
      padding: 10px 15px;
      width: 100%;
    }

    .book-frame {
      background: var(--card-bg);
      border: 3px solid var(--tribal-gold);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    /* 圖片與大型翻頁按鈕區 */
    .img-wrapper {
      position: relative;
      width: 100%;
      height: 0;
      padding-bottom: 56.25%; /* 16:9 比例 */
      background-color: #000;
      overflow: hidden;
      cursor: pointer;
    }

    .story-img {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: contain;
      transition: opacity 0.4s ease;
    }

    .page-badge {
      position: absolute;
      top: 15px; right: 15px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid var(--tribal-gold);
      color: var(--tribal-gold);
      padding: 3px 12px;
      border-radius: 15px;
      font-size: 0.9rem;
      font-weight: bold;
      z-index: 6;
    }

    /* 大尺寸直覺翻頁按鈕 (Overlay Arrows) */
    .nav-arrow-btn {
      position: absolute;
      top: 0; bottom: 0;
      width: 15%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.1);
      color: #fff;
      font-size: 2.5rem;
      border: none;
      z-index: 5;
      transition: all 0.3s ease;
      opacity: 0.4;
    }

    .nav-arrow-btn:hover {
      background: rgba(0, 0, 0, 0.5);
      color: var(--tribal-gold);
      opacity: 1;
    }

    .nav-arrow-left { left: 0; }
    .nav-arrow-right { right: 0; }

    /* 文字與控制區 */
    .story-text-box {
      padding: 15px 20px;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      background: rgba(10, 15, 11, 0.9);
      border-top: 1px solid rgba(233, 196, 106, 0.2);
    }

    .story-text {
      font-size: 1.2rem;
      line-height: 1.6;
      color: #fefae0;
      margin: 0;
      flex-grow: 1;
    }

    /* 顯眼的朗讀按鈕 */
    .read-action-btn {
      background: linear-gradient(135deg, #e9c46a, #f4a261);
      color: #111d13;
      border: none;
      border-radius: 25px;
      padding: 8px 18px;
      font-weight: bold;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(233, 196, 106, 0.4);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .read-action-btn:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #f4a261, #e9c46a);
    }

    /* 底部控制列 */
    .controls-bar {
      position: relative;
      z-index: 10;
      background: rgba(10, 15, 11, 0.95);
      border-top: 2px solid rgba(233, 196, 106, 0.3);
      padding: 10px 20px;
    }

    .btn-nav-bottom {
      background: rgba(233, 196, 106, 0.15);
      border: 1px solid var(--tribal-gold);
      color: var(--tribal-gold);
      border-radius: 8px;
      padding: 6px 16px;
      font-weight: bold;
      transition: all 0.2s;
    }

    .btn-nav-bottom:hover {
      background: var(--tribal-gold);
      color: #111d13;
    }

    @media (max-width: 768px) {
      .title-text { font-size: 1.1rem; }
      .story-text { font-size: 1rem; }
      .nav-arrow-btn { width: 20%; font-size: 1.8rem; opacity: 0.7; }
    }
  </style>
</head>
<body>

  <div class="bg-particles"></div>

  <!-- 頂部標題與功能控制區 -->
  <header class="d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <img src="assets/graphics/spirit.png" alt="靈魂精靈" class="spirit-avatar" onclick="toggleThemeSong()">
      <div>
        <div class="title-text">奇妙的部落 mnanak na qalang</div>
      </div>
    </div>

    <!-- 自動朗讀開關 & 主題曲按鈕 -->
    <div class="d-flex align-items-center gap-2">
      <div class="form-check form-switch text-light me-2">
        <input class="form-check-input" type="checkbox" id="autoReadSwitch" checked onchange="toggleAutoRead(this.checked)">
        <label class="form-check-switch-label small text-warning" for="autoReadSwitch">自動朗讀</label>
      </div>

      <button class="btn btn-outline-warning btn-sm text-light" onclick="toggleThemeSong()" id="themeSongBtn">
        <i class="fa-solid fa-music"></i> 主題曲
      </button>
    </div>
  </header>

  <!-- 繪本主體區 -->
  <main class="book-container">
    <div class="book-frame">
      <!-- 畫面與全畫面翻頁按鈕 -->
      <div class="img-wrapper">
        <span class="page-badge" id="pageBadge">0 / 19</span>
        <img id="storyImage" class="story-img" src="assets/graphics/0.jpg" alt="故事繪本畫面">

        <!-- 大尺寸左右翻頁按鈕 -->
        <button class="nav-arrow-btn nav-arrow-left" onclick="prevPage()" title="上一頁">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button class="nav-arrow-btn nav-arrow-right" onclick="nextPage()" title="下一頁">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

      <!-- 文字與朗讀控制區 -->
      <div class="story-text-box">
        <p class="story-text" id="storyText">載入中...</p>

        <button class="read-action-btn" onclick="playSpeech()" id="readBtn">
          <i class="fa-solid fa-volume-high"></i> 朗讀
        </button>
      </div>
    </div>
  </main>

  <!-- 底部控制列 -->
  <footer class="controls-bar d-flex justify-content-between align-items-center">
    <div class="small text-muted text-warning">
      <i class="fa-solid fa-headphones me-1"></i> <span id="musicTrackName">配樂：music0.mp3</span>
    </div>

    <!-- 底部輔助按鈕 -->
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-nav-bottom btn-sm" onclick="prevPage()"><i class="fa-solid fa-arrow-left me-1"></i> 上一頁</button>
      <button class="btn btn-nav-bottom btn-sm" onclick="nextPage()">下一頁 <i class="fa-solid fa-arrow-right ms-1"></i></button>
    </div>

    <!-- 音量調整 -->
    <div class="d-flex align-items-center gap-2">
      <i class="fa-solid fa-volume-low text-warning small"></i>
      <input type="range" class="form-range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8" style="width: 70px;" onchange="adjustVolume(this.value)">
    </div>
  </footer>

  <!-- 播放器元件 -->
  <audio id="bgMusicPlayer" loop></audio>
  <audio id="speechPlayer"></audio>
  <audio id="themeSongPlayer" src="assets/music/伴奏.mp3.mp3" loop></audio>

  <script>
    const storyData = [
      { id: 0, img: 'assets/graphics/0.jpg', music: 'assets/music/music0.mp3', speech: 'assets/speech/speech0.mp3', text: '在很久很久以前，山林深處有一個充滿奇幻色彩的泰雅部落……' },
      { id: 1, img: 'assets/graphics/1.jpg', music: 'assets/music/music1.mp3', speech: 'assets/speech/speech1.mp3', text: '清晨的第一道曙光照亮山谷，勇士踏上熟悉的獵徑，開啟新的一天。' },
      { id: 2, img: 'assets/graphics/2.jpg', music: 'assets/music/music2.mp3', speech: 'assets/speech/speech2.mp3', text: '當夜晚降臨，大樹下傳來悠揚的笛聲，那是老長老在為孩子們講述部落的傳說。' },
      { id: 3, img: 'assets/graphics/3.jpg', music: 'assets/music/music3.mp3', speech: 'assets/speech/speech3.mp3', text: '傳說在森林的深處，祖靈的雕像默默守護著這片大地與萬物。' },
      { id: 4, img: 'assets/graphics/4.jpg', music: 'assets/music/music4.mp3', speech: 'assets/speech/speech4.mp3', text: '突然間，樹洞泛起奇異的光芒！一群活潑的祖靈小精靈從洞裡跳了出來！' },
      { id: 5, img: 'assets/graphics/5.jpg', music: 'assets/music/music5.mp3', speech: 'assets/speech/speech5.mp3', text: '小精靈們引領著孩子們踏入竹林，腳步聲「咚咚咚」地敲響了森林的脈搏。' },
      { id: 6, img: 'assets/graphics/6.jpg', music: 'assets/music/music6.mp3', speech: 'assets/speech/speech6.mp3', text: '在蟲鳴圍繞的夜晚，小精靈帶來了山林智慧，告訴孩子們如何尊重自然。' },
      { id: 7, img: 'assets/graphics/7.jpg', music: 'assets/music/music7.mp3', speech: 'assets/speech/speech7.mp3', text: '「囉～囉～囉！」大家開心地歡唱，慶祝著人與森林和諧相處的喜悅。' },
      { id: 8, img: 'assets/graphics/8.jpg', music: 'assets/music/music8.mp3', speech: 'assets/speech/speech8.mp3', text: '拍拍手、拍拍手！豐收的喜悅伴隨美味食物，分享給部落的每一個人。' },
      { id: 9, img: 'assets/graphics/9.jpg', music: 'assets/music/music9.mp3', speech: 'assets/speech/speech9.mp3', text: '老長老的琴聲輕揚，將祖先的智慧與對大自然的愛，一代一代傳承下去。' },
      { id: 10, img: 'assets/graphics/10.jpg', music: 'assets/music/music10.mp3', speech: 'assets/speech/speech10.mp3', text: '微風吹過，森林裡的鳥兒一同齊唱，回應著孩子們純真無邪的笑聲。' },
      { id: 11, img: 'assets/graphics/11.jpg', music: 'assets/music/music11.mp3', speech: 'assets/speech/speech11.mp3', text: '一步一步，腳步堅定。經過歷練的孩子塗上彩繪，成為保護部落的勇士。' },
      { id: 12, img: 'assets/graphics/12.jpg', music: 'assets/music/music12.mp3', speech: 'assets/speech/speech12.mp3', text: '經過了一整天的勞動，勇士仰望繁星點點的夜空，心裡充滿感恩。' },
      { id: 13, img: 'assets/graphics/13.jpg', music: 'assets/music/music13.mp3', speech: 'assets/speech/speech13.mp3', text: '清澈的溪水旁響起悠揚笛聲，大家高舉竹杯，共飲象徵團結的甘甜泉水。' },
      { id: 14, img: 'assets/graphics/14.jpg', music: 'assets/music/music14.mp3', speech: 'assets/speech/speech14.mp3', text: '鋼琴聲如跳躍的足跡，孩子們在森林寶庫裡發現了許多珍貴的植物與果實。' },
      { id: 15, img: 'assets/graphics/15.jpg', music: 'assets/music/music15.mp3', speech: 'assets/speech/speech15.mp3', text: '敲響響板，山羊在樹影間悠閒漫步，展現出人與動物的和諧共生。' },
      { id: 16, img: 'assets/graphics/16.jpg', music: 'assets/music/music16.mp3', speech: 'assets/speech/speech16.mp3', text: '「啵！啵！」靈感點亮了思緒，老長老幽默的指點讓孩子恍然大悟。' },
      { id: 17, img: 'assets/graphics/17.jpg', music: 'assets/music/music17.mp3', speech: 'assets/speech/speech17.mp3', text: '營火轟隆隆地燃燒，鼓聲震天，這是專屬於部落最熱烈的感恩慶典！' },
      { id: 18, img: 'assets/graphics/18.jpg', music: 'assets/music/music18.mp3', speech: 'assets/speech/speech18.mp3', text: '老長老撫摸著孩子的頭，祝福他帶著智慧與勇氣繼續成長。' },
      { id: 19, img: 'assets/graphics/19.jpg', music: 'assets/music/music19.mp3', speech: 'assets/speech/speech19.mp3', text: '祖靈精靈展開翅膀飛向天際，這座奇妙的部落將永遠獲得祝福與安康。' }
    ];

    let currentPage = 0;
    let globalVolume = 0.8;
    let isAutoRead = true;
    let isThemePlaying = false;

    const bgMusicPlayer = document.getElementById('bgMusicPlayer');
    const speechPlayer = document.getElementById('speechPlayer');
    const themeSongPlayer = document.getElementById('themeSongPlayer');

    window.addEventListener('DOMContentLoaded', () => {
      updatePageContent(false);
      
      // 點擊喚醒音訊播放（解決瀏覽器自動播放限制）
      document.body.addEventListener('click', () => {
        if (bgMusicPlayer.paused && !isThemePlaying) {
          playBgMusic();
          if (isAutoRead) playSpeech();
        }
      }, { once: true });
    });

    function updatePageContent(shouldPlaySpeech = true) {
      const page = storyData[currentPage];

      // 圖片切換
      const imgElem = document.getElementById('storyImage');
      imgElem.style.opacity = '0';
      setTimeout(() => {
        imgElem.src = page.img;
        imgElem.style.opacity = '1';
      }, 150);

      document.getElementById('storyText').innerText = page.text;
      document.getElementById('pageBadge').innerText = `${currentPage} / ${storyData.length - 1}`;
      document.getElementById('musicTrackName').innerText = `配樂：music${currentPage}.mp3`;

      // 播放音樂
      if (!isThemePlaying) {
        bgMusicPlayer.src = page.music;
        playBgMusic();
      }

      // 自動朗讀
      if (isAutoRead && shouldPlaySpeech) {
        playSpeech();
      }
    }

    function playBgMusic() {
      bgMusicPlayer.volume = globalVolume;
      bgMusicPlayer.play().catch(() => {});
    }

    function playSpeech() {
      const page = storyData[currentPage];
      speechPlayer.src = page.speech;
      speechPlayer.volume = globalVolume;

      // 朗讀時將背景音樂稍微降音量
      bgMusicPlayer.volume = globalVolume * 0.25;

      speechPlayer.play().then(() => {
        document.getElementById('readBtn').classList.add('bg-warning');
      }).catch(() => {
        // 備用語音 fallback (Web Speech API)
        speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(page.text);
        utterance.lang = 'zh-TW';
        utterance.rate = 0.9;
        utterance.onend = () => { bgMusicPlayer.volume = globalVolume; };
        speechSynthesis.speak(utterance);
      });

      speechPlayer.onended = () => {
        bgMusicPlayer.volume = globalVolume;
        document.getElementById('readBtn').classList.remove('bg-warning');
      };
    }

    function toggleAutoRead(checked) {
      isAutoRead = checked;
    }

    function prevPage() {
      if (currentPage > 0) {
        currentPage--;
        updatePageContent(true);
      }
    }

    function nextPage() {
      if (currentPage < storyData.length - 1) {
        currentPage++;
        updatePageContent(true);
      }
    }

    // 鍵盤控制翻頁
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') prevPage();
      if (e.key === 'ArrowRight') nextPage();
    });

    function toggleThemeSong() {
      const btn = document.getElementById('themeSongBtn');
      if (isThemePlaying) {
        themeSongPlayer.pause();
        isThemePlaying = false;
        btn.className = 'btn btn-outline-warning btn-sm text-light';
        updatePageContent(false);
      } else {
        bgMusicPlayer.pause();
        speechPlayer.pause();
        themeSongPlayer.volume = globalVolume;
        themeSongPlayer.play();
        isThemePlaying = true;
        btn.className = 'btn btn-warning btn-sm text-dark';
      }
    }

    function adjustVolume(val) {
      globalVolume = parseFloat(val);
      bgMusicPlayer.volume = globalVolume;
      speechPlayer.volume = globalVolume;
      themeSongPlayer.volume = globalVolume;
    }
  </script>
</body>
</html>
